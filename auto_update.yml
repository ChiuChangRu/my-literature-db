name: Auto-update Papers Database

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  update-papers:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install requests
      - run: |
          python3 << 'EOF'
          import json, os
          print("✅ Workflow executed successfully!")
          with open('config.json') as f:
              config = json.load(f)
          print(f"Email: {os.environ.get('RESEARCHER_EMAIL')}")
          print(f"Queries: {len(config.get('search_queries', []))}")
          EOF
      - run: git config --local user.email "action@github.com" && git config --local user.name "GitHub Action"
      - run: git add papers.json || true
      - run: git commit -m "Auto-update" || true
      - run: git push || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
