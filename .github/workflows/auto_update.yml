name: Auto-update Papers Database
on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: echo "✅ Workflow test successful"
      - run: git config --local user.email "action@github.com" && git config --local user.name "Bot"
      - run: git add . || true
      - run: git commit -m "Auto-update" || true
      - run: git push || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
